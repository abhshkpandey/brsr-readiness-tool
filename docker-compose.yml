# Docker Compose for local development and testing
version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/brsr_assessment
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - REFRESH_TOKEN_EXPIRES_IN=30d
    depends_on:
      - db
    volumes:
      - ./public/reports:/app/public/reports

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=brsr_assessment
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/01-create-database-schema.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  postgres_data:
